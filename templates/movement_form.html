{% extends 'base.html' %}{% block content %}<h1 class="page-title">{% if kind=='IN' %}Kirim qilish{% elif kind=='OUT' %}Chiqim qilish{% else %}Qaytim{% endif %}</h1><div class="modern-card"><form method="post" class="row g-3 modern-form"><div class="col-md-6"><label class="form-label">Mahsulot</label><select name="product_id" class="form-select" required>{% for p in products %}<option value="{{p.id}}">{{p.name}} — {{p.quantity|qty}} {{p.unit}}</option>{% endfor %}</select></div><div class="col-md-3"><label class="form-label">Miqdor</label><input name="quantity" type="number" step="0.01" class="form-control" required></div><div class="col-md-3"><label class="form-label">Narx</label><input name="unit_price" type="number" step="0.01" class="form-control"></div><div class="col-md-6"><label class="form-label">Yetkazib beruvchi / Qayerga ketdi</label><input name="supplier_or_destination" class="form-control"></div><div class="col-md-3"><label class="form-label">Mashina</label><input name="vehicle_model" class="form-control"></div><div class="col-md-3"><label class="form-label">Davlat raqami</label><input name="vehicle_plate" class="form-control"></div><div class="col-md-4"><label class="form-label">Haydovchi</label><input name="driver_name" class="form-control"></div><div class="col-md-4"><label class="form-label">Kim berdi</label><input name="given_by" class="form-control"></div><div class="col-md-4"><label class="form-label">Kim oldi</label><input name="received_by" class="form-control"></div><div class="col-md-4"><label class="form-label">Buyurtma №</label><input name="order_no" class="form-control"></div><div class="col-md-8"><label class="form-label">Kamera havolasi (ixtiyoriy)</label><input name="camera_url" class="form-control"></div><div class="col-12"><label class="form-label">Izoh</label><textarea name="note" class="form-control" rows="3"></textarea></div><div class="col-12"><button class="btn btn-success px-4"><i class="bi bi-check2-circle me-1"></i> Saqlash</button></div></form></div>{% endblock %}
