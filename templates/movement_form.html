{% extends 'base.html' %}{% block content %}<h3>{% if kind=='IN' %}Kirim{% elif kind=='OUT' %}Chiqim{% else %}Qaytim{% endif %}</h3><div class="card p-4"><form method="post" class="row g-3"><div class="col-md-6"><label>Mahsulot</label><select name="product_id" class="form-select" required>{% for p in products %}<option value="{{p.id}}">{{p.name}} — {{p.quantity:g}} {{p.unit}}</option>{% endfor %}</select></div><div class="col-md-3"><label>Miqdor</label><input name="quantity" type="number" step="0.01" class="form-control" required></div><div class="col-md-3"><label>Narx</label><input name="unit_price" type="number" step="0.01" class="form-control"></div><div class="col-md-6"><label>Yetkazib beruvchi / Qayerga ketdi</label><input name="supplier_or_destination" class="form-control"></div><div class="col-md-3"><label>Mashina</label><input name="vehicle_model" class="form-control"></div><div class="col-md-3"><label>Davlat raqami</label><input name="vehicle_plate" class="form-control"></div><div class="col-md-4"><label>Haydovchi</label><input name="driver_name" class="form-control"></div><div class="col-md-4"><label>Kim berdi</label><input name="given_by" class="form-control"></div><div class="col-md-4"><label>Kim oldi</label><input name="received_by" class="form-control"></div><div class="col-md-4"><label>Buyurtma №</label><input name="order_no" class="form-control"></div><div class="col-md-8"><label>Kamera havolasi (ixtiyoriy)</label><input name="camera_url" class="form-control"></div><div class="col-12"><label>Izoh</label><textarea name="note" class="form-control"></textarea></div><div class="col-12"><button class="btn btn-success">Saqlash</button></div></form></div>{% endblock %}
