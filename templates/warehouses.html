{% extends 'base.html' %}{% block content %}
<h1 class="h3 fw-bold mb-3">Omborlar</h1><div class="row g-3"><div class="col-lg-4"><div class="modern-card"><h5 class="fw-bold">Yangi ombor</h5><form method="post"><label class="form-label">Nomi</label><input name="name" class="form-control mb-2" required placeholder="Asosiy ombor"><label class="form-label">Kod</label><input name="code" class="form-control mb-2" required placeholder="OMB-1"><label class="form-label">Manzil/izoh</label><input name="address" class="form-control mb-3" placeholder="Chilonzor"><button class="btn btn-success w-100">Qo‘shish</button></form></div></div><div class="col-lg-8"><div class="modern-card"><div class="table-responsive"><table class="table table-modern"><thead><tr><th>Ombor</th><th>Kod</th><th>Manzil</th><th>Holat</th><th></th></tr></thead><tbody>{% for r in rows %}<tr><td class="fw-bold">{{r.name}}</td><td>{{r.code}}</td><td>{{r.address or '-'}}</td><td><span class="badge {{'text-bg-success' if r.active else 'text-bg-secondary'}}">{{'Faol' if r.active else 'To‘xtagan'}}</span></td><td><form method="post" action="{{url_for('warehouse_toggle',row_id=r.id)}}"><button class="btn btn-sm btn-outline-secondary">{{'To‘xtatish' if r.active else 'Faollashtirish'}}</button></form></td></tr>{% else %}<tr><td colspan="5" class="text-center text-secondary py-4">Ombor qo‘shilmagan.</td></tr>{% endfor %}</tbody></table></div></div></div></div>
{% endblock %}
