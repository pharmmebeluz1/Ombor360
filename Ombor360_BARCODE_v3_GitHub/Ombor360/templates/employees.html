{% extends 'base.html' %}{% block content %}<h1 class="page-title">Xodimlar</h1><div class="modern-card mb-3"><form method="post" class="row g-2"><div class="col-md-3"><input name="full_name" class="form-control" placeholder="F.I.Sh." required></div><div class="col-md-2"><input name="username" class="form-control" placeholder="Login" required></div><div class="col-md-2"><input name="password" class="form-control" placeholder="Parol"></div><div class="col-md-2"><select name="role" class="form-select"><option value="employee">Xodim</option><option value="warehouse">Omborchi</option><option value="cashier">Kassir</option><option value="accountant">Buxgalter</option><option value="manager">Rahbar</option></select></div><div class="col-md-2"><input name="monthly_salary" type="number" class="form-control" placeholder="Oylik"></div><div class="col-md-1"><button class="btn btn-success w-100">+</button></div></form></div><div class="modern-card"><table class="table"><tr><th>F.I.Sh</th><th>Login</th><th>Rol</th><th>Oylik</th></tr>{% for u in users %}<tr><td>{{u.full_name}}</td><td>{{u.username}}</td><td>{{u.role}}</td><td>{{u.monthly_salary|money}}</td></tr>{% endfor %}</table></div>{% endblock %}
