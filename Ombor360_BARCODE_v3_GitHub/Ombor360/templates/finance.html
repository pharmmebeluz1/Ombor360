{% extends 'base.html' %}{% block content %}<h1 class="page-title">Moliya</h1><div class="modern-card mb-3"><form method="post" class="row g-2"><div class="col-md-2"><select name="kind" class="form-select"><option value="revenue">Tushum</option><option value="expense">Xarajat</option></select></div><div class="col-md-2"><input name="amount" type="number" step="0.01" class="form-control" placeholder="Summa" required></div><div class="col-md-3"><input name="category" class="form-control" placeholder="Kategoriya"></div><div class="col-md-4"><input name="note" class="form-control" placeholder="Izoh"></div><div class="col-md-1"><button class="btn btn-success w-100">+</button></div></form></div><div class="row g-3"><div class="col-md-6"><div class="modern-card"><h5>Tushumlar</h5><table class="table table-sm">{% for r in revenues %}<tr><td>{{r.created_at.strftime('%d.%m')}}</td><td>{{r.source}}</td><td class="text-end">{{r.amount|money}}</td></tr>{% endfor %}</table></div></div><div class="col-md-6"><div class="modern-card"><h5>Xarajatlar</h5><table class="table table-sm">{% for r in expenses %}<tr><td>{{r.created_at.strftime('%d.%m')}}</td><td>{{r.category}}</td><td class="text-end">{{r.amount|money}}</td></tr>{% endfor %}</table></div></div></div>{% endblock %}
