{% extends 'base.html' %}
{% block title %}Kirish — Ombor360°{% endblock %}
{% block guest_content %}
<div class="login-card">
  <img src="{{ url_for('static', filename='logo.png') }}" class="login-logo" alt="Ombor360 logo">
  <h3 class="text-center fw-bold mb-1">Tizimga kirish</h3>
  <p class="text-center text-secondary small mb-4">Ombor, xodim va moliyaviy nazorat markazi</p>
  <form method="post" class="modern-form">
    <label class="form-label fw-semibold">Login</label>
    <input name="username" class="form-control mb-3" autocomplete="username" required>
    <label class="form-label fw-semibold">Parol</label>
    <input name="password" type="password" class="form-control mb-4" autocomplete="current-password" required>
    <button class="btn btn-success w-100 py-2 fw-bold">Kirish</button>
  </form>
</div>
{% endblock %}
